services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: em_backend
    networks:
      - internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: em_nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    networks:
      - internal
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

networks:
  internal:
    driver: bridge
    name: em_network
