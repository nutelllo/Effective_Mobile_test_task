services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: em_backend
    # No ports published — accessible only within the Docker network
    networks:
      - internal
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: em_nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

networks:
  internal:
    driver: bridge
    name: em_network
